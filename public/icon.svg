<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />

  <!-- Shield Shape (Faith) -->
  <path d="M256 90 L390 144 C390 286 256 394 256 394 C256 394 122 286 122 144 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#goldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Inset Shield Line -->
  <path d="M256 112 L368 158 C368 270 256 360 256 360 C256 360 144 270 144 158 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-opacity="0.4" />

  <!-- Holy Cross of Christ -->
  <!-- Vertical Beam -->
  <path d="M246 160 H266 V324 H246 Z" fill="url(#goldGrad)" rx="3" />
  <!-- Horizontal Beam -->
  <path d="M208 206 H304 V226 H208 Z" fill="url(#goldGrad)" rx="3" />

  <!-- Center Radiance Star -->
  <circle cx="256" cy="216" r="6" fill="#ffffff" filter="url(#glow)" />
  <path d="M256 198 L256 234 M238 216 L274 216" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
